services:
  tunebridge:
    build: .
    image: tunebridge:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TUNEBRIDGE_HOST: 0.0.0.0
    volumes:
      - tunebridge_data:/app/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tunebridge

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TUNEBRIDGE_DOMAIN: ${TUNEBRIDGE_DOMAIN:?set TUNEBRIDGE_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      tunebridge:
        condition: service_healthy
    networks:
      - tunebridge

volumes:
  tunebridge_data:
  caddy_data:
  caddy_config:

networks:
  tunebridge:
